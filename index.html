$('ability').onclick=use;$('shades').onclick=()=>{glasses=!glasses};function pointer(e){if(modal||paused||mission<0)return;let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;if(mini?.kind==='duel'){shoot(x,y);return}go={x:clamp(x,20,W-20),y:clamp(y,320,603)};if(goal&&Math.abs(goal.x-x)<55&&Math.abs(goal.y-y)<85)go={x:goal.x,y:goal.y}}

function swiss(){scene('bar',1);roster();story('Chassi','Ou, vamo voltar que amanhã tem aula do Moniz.',()=>{scene('h8');roster();target('Encontro da turma',900,442,()=>story('O desafio','“Duvido que o Gucci ganhe da gente no fliperama.” Suíço responde: “Nós é os ITA!”',()=>duel(1,4)))})}
function duel(id,n){scene('arena',id);roster();let targets=Array.from({length:n},(_,i)=>({x:170+(i%3)*305+i*11,y:305+Math.floor(i/3)*96,phase:Math.random()*6}));mini={kind:'duel',targets,score:0,shots:0};hud('Acerte os '+n+' discos de luz em movimento. Clique ou toque.');$('ability').textContent='Mirar · E';action=()=>{let t=targets[0];target('Pulso',clamp(t.x,25,1050),clamp(t.y+25,330,590),()=>hit(t),'Chegue ao marcador para disparar o pulso.')}}

function hit(t){if(!mini?.targets.includes(t))return;note(700,.12);mini.score++;mini.targets.splice(mini.targets.indexOf(t),1);goal=go=null;if(mini.targets.length){hud('Discos restantes: '+mini.targets.length);return}mini=action=null;$('ability').textContent='Habilidade';if(hero===1)story('“Gucci! Gucci!”','A turma responde em coro. Gucci assume o segundo round contra o campeão.',()=>duel(6,6));else story('Gucci','Já provei meu ponto. Agora leva nós pro B.',()=>{scene('h8',1);roster();target('Hall do B',790,410,()=>{scene('class',1);roster();finish('Aula do Moniz','Na manhã seguinte, os sete mal conseguem manter os olhos abertos. Chassi é o primeiro a cochilar.')})})}

let f=voices[0];target('“'+lines[f.id]+'”',f.x,f.y,()=>{let collect=()=>{team.push(f.id);voices.shift();hud(cast[f.id]+' voltou ao grupo.');seek()};if(rescue)waitAction('X','Use X para chamar '+cast[f.id]+' com a dança.',()=>{dance=2;collect()});else collect()},'Siga a voz na festa · '+team.length+'/6 amigos');if('speechSynthesis' in window&&!muted){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(lines[f.id]);u.lang='pt-BR';u.volume=.45;speechSynthesis.speak(u)}catch{}}}seek()}
